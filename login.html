<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Mezzaq Quiz Creator</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body {
      background-color: #0b192c;
      color: #f8fafc;
      display: flex; justify-content: center; align-items: center;
      height: 100vh; margin: 0; padding: 20px;
    }
    .auth-card {
      background: #1e293b; max-width: 400px; width: 100%;
      padding: 40px 30px; border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #334155;
    }
    h2 { text-align: center; color: #f8fafc; margin-top: 0; margin-bottom: 25px; font-size: 26px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-weight: 600; color: #94a3b8; font-size: 14px; }
    input[type="email"], input[type="password"] {
      width: 100%; padding: 12px 16px; border: 1px solid #334155;
      border-radius: 10px; font-size: 15px; background: #0f172a; color: #fff;
      transition: all 0.3s ease;
    }
    input:focus { outline: none; border-color: #38bdf8; }
    .main-btn {
      width: 100%; padding: 14px; background: #3b82f6; color: white;
      border: none; border-radius: 10px; font-size: 16px; font-weight: bold;
      cursor: pointer; transition: background 0.3s; margin-top: 10px;
    }
    .main-btn:hover { background: #2563eb; }
    .toggle-text { text-align: center; margin-top: 20px; font-size: 14px; color: #94a3b8; }
    .toggle-text span { color: #38bdf8; font-weight: bold; cursor: pointer; }
    .toggle-text span:hover { text-decoration: underline; }
  </style>
</head>
<body>

<div class="auth-card">
  <h2 id="form-title">Log In</h2>
  <div class="form-group">
    <label for="email">Email</label>
    <input type="email" id="email" placeholder="Enter your email">
  </div>
  <div class="form-group">
    <label for="password">Password</label>
    <input type="password" id="password" placeholder="Enter your password">
  </div>
  <button class="main-btn" id="submit-btn" onclick="processAuth()">Log In</button>
  <div class="toggle-text" id="toggle-container">
    Don't have an account? <span onclick="toggleMode()">Sign Up</span>
  </div>
</div>

<script>
  let isSignUpMode = false;

  function toggleMode() {
    isSignUpMode = !isSignUpMode;
    document.getElementById('form-title').innerText = isSignUpMode ? "Sign Up" : "Log In";
    document.getElementById('submit-btn').innerText = isSignUpMode ? "Sign Up" : "Log In";
    document.getElementById('toggle-container').innerHTML = isSignUpMode 
      ? `Already have an account? <span onclick="toggleMode()">Log In</span>`
      : `Don't have an account? <span onclick="toggleMode()">Sign Up</span>`;
  }

  function processAuth() {
    const email = document.getElementById('email').value.trim().toLowerCase();
    const password = document.getElementById('password').value.trim();

    if (!email || !password) {
      alert('Please fill out both email and password.');
      return;
    }

    let users = JSON.parse(localStorage.getItem('quiz_registered_users')) || {};

    if (isSignUpMode) {
      if (users[email]) {
        alert('An account with this email already exists! Please log in.');
        return;
      }
      users[email] = { password: password };
      localStorage.setItem('quiz_registered_users', JSON.stringify(users));
      localStorage.setItem('quiz_user', JSON.stringify({ email: email, loggedIn: true }));
      window.location.href = 'index.html';
    } else {
      if (!users[email] || users[email].password !== password) {
        alert('Invalid email or password. Please sign up if you do not have an account.');
        return;
      }
      localStorage.setItem('quiz_user', JSON.stringify({ email: email, loggedIn: true }));
      window.location.href = 'index.html';
    }
  }

  // Redirect to index.html if already logged in
  window.onload = function() {
    const user = JSON.parse(localStorage.getItem('quiz_user'));
    if (user && user.loggedIn) {
      window.location.href = 'index.html';
    }
  };
</script>

</body>
</html>
