<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Mezzaq Quiz Creator</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body {
      background-color: #0b192c;
      color: #f8fafc;
      display: flex; justify-content: center; align-items: center;
      height: 100vh; margin: 0; padding: 20px;
    }
    .auth-card {
      background: #1e293b; max-width: 400px; width: 100%;
      padding: 40px 30px; border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #334155;
    }
    h2 { text-align: center; color: #f8fafc; margin-top: 0; margin-bottom: 25px; font-size: 26px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-weight: 600; color: #94a3b8; font-size: 14px; }
    input[type="email"], input[type="password"] {
      width: 100%; padding: 12px 16px; border: 1px solid #334155;
      border-radius: 10px; font-size: 15px; background: #0f172a; color: #fff;
      transition: all 0.3s ease;
    }
    input:focus { outline: none; border-color: #38bdf8; }
    .main-btn {
      width: 100%; padding: 14px; background: #3b82f6; color: white;
      border: none; border-radius: 10px; font-size: 16px; font-weight: bold;
      cursor: pointer; transition: background 0.3s; margin-top: 10px;
    }
    .main-btn:hover { background: #2563eb; }
    .toggle-text { text-align: center; margin-top: 20px; font-size: 14px; color: #94a3b8; }
    .toggle-text span { color: #38bdf8; font-weight: bold; cursor: pointer; }
    .toggle-text span:hover { text-decoration: underline; }
  </style>

  <!-- Firebase Compatibility SDKs for direct browser usage -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
</head>
<body>

<div class="auth-card">
  <h2 id="form-title">Log In</h2>
  <div class="form-group">
    <label for="email">Email</label>
    <input type="email" id="email" placeholder="Enter your email">
  </div>
  <div class="form-group">
    <label for="password">Password</label>
    <input type="password" id="password" placeholder="Enter your password">
  </div>
  <button class="main-btn" id="submit-btn" onclick="processAuth()">Log In</button>
  <div class="toggle-text" id="toggle-container">
    Don't have an account? <span onclick="toggleMode()">Sign Up</span>
  </div>
</div>

<script>
  // Your Exact Firebase Configuration
  const firebaseConfig = {
    apiKey: "AIzaSyBKuPKg3YuMzqw0cMAzTtUbeZERbY4UCNM",
    authDomain: "mezzaq-79803.firebaseapp.com",
    databaseURL: "https://mezzaq-79803-default-rtdb.firebaseio.com",
    projectId: "mezzaq-79803",
    storageBucket: "mezzaq-79803.firebasestorage.app",
    messagingSenderId: "615491940231",
    appId: "1:615491940231:web:837decc59171eb6679ed22",
    measurementId: "G-VVTEHSJBNT"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();

  let isSignUpMode = false;

  function toggleMode() {
    isSignUpMode = !isSignUpMode;
    document.getElementById('form-title').innerText = isSignUpMode ? "Sign Up" : "Log In";
    document.getElementById('submit-btn').innerText = isSignUpMode ? "Sign Up" : "Log In";
    document.getElementById('toggle-container').innerHTML = isSignUpMode 
      ? `Already have an account? <span onclick="toggleMode()">Log In</span>`
      : `Don't have an account? <span onclick="toggleMode()">Sign Up</span>`;
  }

  function processAuth() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value.trim();

    if (!email || !password) {
      alert('Please fill out both email and password.');
      return;
    }

    if (isSignUpMode) {
      auth.createUserWithEmailAndPassword(email, password)
        .then(() => {
          alert('Account created successfully!');
          window.location.href = 'index.html';
        })
        .catch(error => alert(error.message));
    } else {
      auth.signInWithEmailAndPassword(email, password)
        .then(() => {
          window.location.href = 'index.html';
        })
        .catch(error => alert(error.message));
    }
  }

  auth.onAuthStateChanged(user => {
    if (user) {
      window.location.href = 'index.html';
    }
  });
</script>

</body>
</html>
